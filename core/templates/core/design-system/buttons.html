<section id="sec-buttons" class="ds-section">
  <h2 class="mb-1">دکمه‌ها</h2>
  <p class="text-body-secondary">در هر صفحه فقط یک دکمه‌ی اصلی؛ کارهای برگشت‌ناپذیر با دکمه‌ی خطر و تأیید؛ دکمه همیشه می‌گوید چه می‌کند.</p>
  <div class="row g-3">
    <div class="col-12">
      <div class="card card-elevated"><div class="card-body">
        <h3 class="h6 text-body-secondary mb-3">انواع</h3>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-primary">ذخیره</button>
          <button type="button" class="btn btn-secondary">افزودن کتاب</button>
          <button type="button" class="btn btn-outline-primary">ویرایش</button>
          <button type="button" class="btn btn-outline-secondary">فیلتر</button>
          <button type="button" class="btn btn-success">تمام شد</button>
          <button type="button" class="btn btn-danger">حذف</button>
          <button type="button" class="btn btn-link">انصراف</button>
        </div>
      </div></div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card card-elevated h-100"><div class="card-body">
        <h3 class="h6 text-body-secondary mb-3">اندازه‌ها</h3>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <button type="button" class="btn btn-primary btn-sm">کوچک</button>
          <button type="button" class="btn btn-primary">معمولی</button>
          <button type="button" class="btn btn-primary btn-lg">بزرگ</button>
        </div>
      </div></div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card card-elevated h-100"><div class="card-body">
        <h3 class="h6 text-body-secondary mb-3">غیرفعال و در حال بارگذاری</h3>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <button type="button" class="btn btn-primary" disabled>ذخیره</button>
          <button type="button" class="btn btn-outline-primary" disabled>ویرایش</button>
          <button type="button" class="btn btn-primary" disabled>
            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
            در حال ذخیره…
          </button>
        </div>
      </div></div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card card-elevated h-100"><div class="card-body">
        <h3 class="h6 text-body-secondary mb-3">گروه دکمه</h3>
        <div class="btn-group" role="group" aria-label="فیلتر وضعیت">
          <input type="radio" class="btn-check" name="status-filter" id="filter-all" autocomplete="off" checked>
          <label class="btn btn-outline-primary" for="filter-all">همه</label>
          <input type="radio" class="btn-check" name="status-filter" id="filter-reading" autocomplete="off">
          <label class="btn btn-outline-primary" for="filter-reading">در حال خواندن</label>
          <input type="radio" class="btn-check" name="status-filter" id="filter-done" autocomplete="off">
          <label class="btn btn-outline-primary" for="filter-done">تمام‌شده</label>
        </div>
      </div></div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card card-elevated h-100"><div class="card-body">
        <h3 class="h6 text-body-secondary mb-3">تمام‌عرض در موبایل</h3>
        <div class="d-grid d-sm-flex gap-2">
          <button type="button" class="btn btn-primary">ذخیره</button>
          <button type="button" class="btn btn-outline-primary">انصراف</button>
        </div>
      </div></div>
    </div>
  </div>
</section>
