{# Card. Params: title, text, badge (optional), badge_kind (optional), action_url, action_label (optional), elevated (bool) #}
<div class="card h-100{% if elevated %} card-elevated{% endif %}">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
      <h3 class="card-title h5 mb-0">{{ title }}</h3>
      {% if badge %}<span class="badge rounded-pill text-bg-{{ badge_kind|default:'primary' }}">{{ badge }}</span>{% endif %}
    </div>
    {% if text %}<p class="card-text text-body-secondary mb-3">{{ text }}</p>{% endif %}
    {% if action_url %}
      <a href="{{ action_url }}" class="btn btn-outline-primary btn-sm mt-auto align-self-start">{{ action_label|default:'مشاهده' }}</a>
    {% endif %}
  </div>
</div>
