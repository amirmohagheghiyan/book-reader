{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ jozveh_title }} — جزوه‌ساز</title>
  <link rel="icon" href="{% static 'brand/aleflogo.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'css/vendor/bootstrap.rtl.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="jozveh-print">
  <div class="jozveh-print-bar d-print-none">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 py-2">
      <a href="{% url 'jozveh:editor' book.pk %}" class="btn btn-outline-primary btn-sm">بازگشت به ویرایش</a>
      {% if blocks %}<button type="button" class="btn btn-primary btn-sm" data-print>چاپ یا ذخیره‌ی PDF</button>{% endif %}
    </div>
  </div>

  <main id="main" class="container jozveh-print-page py-4">
    <header class="jozveh-print-header mb-4">
      <h1 class="mb-1">{{ book.title }}</h1>
      {% if book.author %}<p class="lead text-body-secondary mb-0">{{ book.author }}</p>{% endif %}
    </header>

    {% for block in blocks %}
      <section class="jozveh-block jozveh-block-{{ block.kind }} mb-4">
        {% include block.template_name %}
      </section>
    {% empty %}
      <p class="text-body-secondary">این جزوه هنوز بلوکی ندارد.</p>
    {% endfor %}
  </main>

  <script src="{% static 'js/vendor/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
