{% extends "base.html" %}

{% block title %}حذف کتاب — جزوه‌ساز{% endblock %}

{% block content %}
{% include "components/page-header.html" with title="حذف کتاب" breadcrumbs=breadcrumbs %}

<div class="row">
  <div class="col-12 col-lg-8 col-xl-6">
    <div class="card card-elevated">
      <div class="card-body">
        <h2 class="h5 mb-2">«{{ object.title }}» حذف شود؟</h2>
        <p class="text-body-secondary">{{ object.delete_warning }}</p>
        <form method="post" class="d-grid d-sm-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">حذف</button>
          <a href="{% url 'books:list' %}" class="btn btn-outline-primary">انصراف</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
